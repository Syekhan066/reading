<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tes Reading</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1c2033;--mu:#667085;--pr:#4f46e5;--ok:#16a34a;--no:#dc2626;--bd:#e3e6f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#eceefa;--mu:#9aa0b8;--pr:#818cf8;--ok:#4ade80;--no:#f87171;--bd:#2b3046}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#eceefa;--mu:#9aa0b8;--pr:#818cf8;--ok:#4ade80;--no:#f87171;--bd:#2b3046}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 8px}.mu{color:var(--mu);font-size:14px}
button,.b{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 16px}
.p{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:600}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=password]{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:8px 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2}
.t{font-weight:700;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--bd)}.t.lo{color:var(--no);border-color:var(--no)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pr)}
.pas{white-space:pre-wrap;font-size:15px;max-height:260px;overflow:auto;border-left:3px solid var(--pr);padding-left:12px}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}.o.s{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,var(--card))}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--card))}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:12px}.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.d{width:28px;height:28px;padding:0;border-radius:50%;font-size:12px}.d.a{background:var(--pr);color:#fff;border-color:var(--pr)}.d.n{outline:2px solid var(--tx)}
.big{font-size:44px;font-weight:800;color:var(--pr)}.ox{color:var(--ok);font-weight:700}.xx{color:var(--no);font-weight:700}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:center;white-space:nowrap}td:nth-child(2),th:nth-child(2){text-align:left}
pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto;font-size:12px;max-height:180px}
</style></head><body><div class="w" id="app"></div>
<script>
const SUPA_URL = "https://pvaissxwkjrcleeatgsg.supabase.co";
const SUPA_KEY = "sb_publishable_4AVWJttjgeJpN8O2vCwG0g_V29FAiaY";
const L="ABCDEF",$=s=>document.getElementById(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cfg=null,view="home",name="",qs=[],ans=[],cur=0,endAt=0,tm=null,res=null,pw="",adm=null,note="",arm=false,used=0,isAuto=false;
const flat=c=>c.passages.flatMap((p,pi)=>p.questions.map(q=>({...q,pi,p})));
async function rpc(fn,args){const r=await fetch(SUPA_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});const t=await r.text();if(!r.ok){let m=t;try{m=JSON.parse(t).message}catch(e){}throw new Error(m)}return t?JSON.parse(t):null}
async function init(){try{cfg=await rpc("get_config")}catch(e){note="Gagal terhubung ke server."}render()}
function home(){view="home";note="";render()}
function render(){const a=$("app");
if(view==="home")a.innerHTML=cfg?`<div class="c"><h1>${E(cfg.title)}</h1><p class="mu">${flat(cfg).length} soal · ${cfg.passages.length} bacaan · waktu total ${cfg.minutes} menit. Soal muncul satu per satu. Jika waktu habis, jawaban otomatis dikumpulkan.</p><label>Nama lengkap</label><input type="text" id="nm" value="${E(name)}" placeholder="Tulis namamu"><button class="p" onclick="start()">Mulai Tes</button></div><button onclick="view='login';note='';render()">Admin</button>`:`<div class="c"><h1>Tes Reading</h1><p class="mu">${E(note||"Soal belum tersedia.")}</p></div><button onclick="view='login';note='';render()">Admin</button>`;
else if(view==="login")a.innerHTML=`<div class="c"><h2>Login Admin</h2><input type="password" id="pw" placeholder="Password admin" onkeydown="if(event.key==='Enter')login()"><div class="row" style="justify-content:flex-start"><button class="p" onclick="login()">Masuk</button><button onclick="home()">Kembali</button></div><p class="mu">${E(note)}</p></div>`;
else if(view==="test")drawQ();else if(view==="result")drawRes();else drawAdmin()}
function start(){name=$("nm").value.trim();if(!name){$("nm").focus();return}qs=flat(cfg);ans=qs.map(()=>null);cur=0;endAt=Date.now()+cfg.minutes*60000;view="test";render();clearInterval(tm);tm=setInterval(tick,250)}
function tick(){const r=Math.max(0,endAt-Date.now()),el=$("tm");if(el){const s=Math.ceil(r/1000);el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");el.classList.toggle("lo",s<=60)}if(r<=0)submit(true)}
function drawQ(){const q=qs[cur],n=qs.length;
$("app").innerHTML=`<div class="top"><span class="mu">Soal ${cur+1} / ${n}</span><span class="t" id="tm">--:--</span></div><div class="bar"><i style="width:${(cur+1)/n*100}%"></i></div>
<div class="c"><h2>${E(q.p.title)}</h2><div class="pas">${E(q.p.text)}</div></div>
<div class="c"><h2>${cur+1}. ${E(q.q)}</h2>${q.o.map((o,i)=>`<button class="o ${ans[cur]===L[i]?"s":""}" onclick="pick('${L[i]}')"><b>${L[i]}.</b> ${E(o)}</button>`).join("")}
<div class="row"><button ${cur?"":"disabled"} onclick="go(-1)">← Sebelumnya</button>${cur<n-1?'<button class="p" onclick="go(1)">Selanjutnya →</button>':'<button class="p" onclick="submit(false)">Kumpulkan ✓</button>'}</div>
<div class="dots">${qs.map((_,i)=>`<button class="d ${ans[i]?"a":""} ${i===cur?"n":""}" onclick="cur=${i};drawQ()">${i+1}</button>`).join("")}</div></div>`;tick()}
function pick(l){ans[cur]=l;drawQ()}function go(d){cur+=d;drawQ()}
function submit(auto){if(view!=="test")return;clearInterval(tm);isAuto=auto;used=Math.min(cfg.minutes*60,Math.round((cfg.minutes*60000-(endAt-Date.now()))/1000));view="result";res=null;send()}
async function send(){note="Mengirim jawaban…";render();try{res=await rpc("submit_result",{p_name:name,p_ver:cfg.version,p_ans:ans.map(x=>x||"-"),p_sec:used,p_auto:isAuto});note=""}catch(e){note="⚠️ Gagal mengirim: "+e.message}render()}
function drawRes(){if(!res){$("app").innerHTML=`<div class="c"><p>${E(note)}</p>${note.startsWith("⚠")?'<button class="p" onclick="send()">Coba kirim lagi</button>':""}</div>`;return}
$("app").innerHTML=`<div class="c" style="text-align:center"><p class="mu">${E(name)}${isAuto?" · waktu habis, otomatis dikumpulkan":""}</p><div class="big">${res.score} / ${res.total}</div><p class="mu">✅ Hasilmu sudah tercatat.</p></div>
${qs.map((q,i)=>{const u=ans[i]||"-",k=res.key[i],ok=u===k;return `<div class="c"><b>${i+1}. ${E(q.q)}</b> <span class="${ok?"ox":"xx"}">${ok?"✓ Benar":u==="-"?"✗ Kosong":"✗ Salah"}</span>${q.o.map((o,j)=>`<div class="o ${L[j]===k?"ok":L[j]===u?"no":""}" style="cursor:default"><b>${L[j]}.</b> ${E(o)}</div>`).join("")}</div>`}).join("")}<button onclick="name='';home()">Selesai</button>`}
async function login(){pw=$("pw").value;try{adm=await rpc("admin_results",{pw});note="";view="admin"}catch(e){pw="";note="Password salah."}render()}
function drawAdmin(){const k=adm.key||[],R=adm.rows;$("app").innerHTML=`<div class="c"><div class="row" style="margin:0"><h1>Admin</h1><button onclick="pw='';adm=null;home()">Keluar</button></div>
<p class="mu">${cfg?E(cfg.title):"Belum ada soal"} · ${k.length} soal · ${R.length} peserta</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="p" onclick="csv()">⬇️ Download rekap (CSV)</button><button onclick="rst()">${arm?"Klik lagi: hapus semua hasil":"Reset hasil"}</button><button onclick="refresh()">🔄 Refresh</button></div><p class="mu">${E(note)}</p></div>
<div class="c sc"><table><tr><th>#</th><th>Nama</th><th>Skor</th>${k.map((_,i)=>`<th>${i+1}</th>`).join("")}</tr>${R.map((r,n)=>`<tr><td>${n+1}</td><td>${E(r.name)}</td><td><b>${r.score}</b></td>${k.map((x,i)=>`<td class="${r.ans[i]===x?"ox":"xx"}">${r.ans[i]===x?"✓":"✗"}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="9" class="mu">Belum ada peserta.</td></tr>`}</table></div>
<div class="c"><h2>Upload soal baru</h2><p class="mu">Pilih file <b>.json</b> sesuai template. Soal & leaderboard otomatis pindah ke set yang baru.</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><input type="file" accept=".json,application/json" onchange="up(this.files[0])"><button onclick="tpl()">Download template</button></div></div>`}
async function refresh(){try{adm=await rpc("admin_results",{pw});note=""}catch(e){note="Gagal refresh: "+e.message}drawAdmin()}
function dl(f,d,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:t||"text/csv;charset=utf-8"}));a.download=f;document.body.appendChild(a);a.click();a.remove()}
function csv(){const k=adm.key,z=v=>'"'+String(v).replace(/"/g,'""')+'"';
const h=["No","Nama","Skor","Total","Durasi (detik)","Waktu habis",...k.map((x,i)=>"S"+(i+1)+" (kunci "+x+")")];
const b=adm.rows.map((r,n)=>[n+1,r.name,r.score,r.total,r.sec,r.auto?"Ya":"Tidak",...k.map((x,i)=>{const u=r.ans[i];return (u===x?"Benar":u==="-"?"Kosong":"Salah")+" ("+u+")"})]);
dl("rekap-tes-reading.csv","\ufeff"+[h,...b].map(r=>r.map(z).join(",")).join("\r\n"))}
async function rst(){if(!arm){arm=true;drawAdmin();setTimeout(()=>{if(arm){arm=false;drawAdmin()}},4000);return}arm=false;try{await rpc("admin_reset",{pw});adm=await rpc("admin_results",{pw});note="Hasil direset."}catch(e){note="Gagal reset: "+e.message}drawAdmin()}
function tpl(){dl("template-soal.json",JSON.stringify({title:"Judul Tes",minutes:5,passages:[{title:"Judul Bacaan 1",text:"Isi bacaan...",questions:[{q:"Pertanyaan 1?",o:["Opsi A","Opsi B","Opsi C","Opsi D"],a:"B"}]}]},null,2),"application/json")}
async function up(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.passages)||!j.passages.length)throw"passages kosong";const k=[];
j.passages.forEach((p,i)=>{if(!p.text||!Array.isArray(p.questions)||!p.questions.length)throw"Bacaan "+(i+1)+" tidak lengkap";p.questions.forEach((q,n)=>{if(!q.q||!Array.isArray(q.o)||q.o.length<2||!L.slice(0,q.o.length).includes(q.a))throw"Bacaan "+(i+1)+" soal "+(n+1)+" tidak valid (cek o & a)"})});
const ver=Date.now(),c={version:ver,title:j.title||"Tes Reading",minutes:Number(j.minutes)||5,passages:j.passages.map(p=>({title:p.title||"",text:p.text,questions:p.questions.map(q=>{k.push(q.a);return{q:q.q,o:q.o}})}))};
await rpc("admin_set_config",{pw,p_cfg:c,p_key:k,p_ver:ver});cfg=c;adm=await rpc("admin_results",{pw});note="✅ Soal baru berhasil diupload ("+k.length+" soal)."}catch(e){note="❌ Gagal: "+(e.message||e)}drawAdmin()}
init();
</script></body></html>
